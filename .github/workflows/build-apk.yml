name: Build APK

on:
  push:
    branches: [ "main" ]
    paths:
      - 'android_app/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      # 1. Set up Java 17 for modern Android Gradle Plugin
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 2. Set up Python 3.11
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 3. System dependencies
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git python3-pip python3-dev python3-venv \
            libffi-dev libssl-dev ffmpeg \
            autoconf automake libtool pkg-config ccache \
            wget curl unzip zip

      # 4. Install Buildozer and Cython
      - name: Install Buildozer & Dependencies
        run: |
          pip install --upgrade pip setuptools virtualenv "Cython<3.0" buildozer Pillow

      # 5. Create placeholder assets
      - name: Create placeholder assets
        run: |
          mkdir -p android_app/assets
          python -c "
          from PIL import Image
          img = Image.new('RGBA', (400, 800), (26, 115, 232, 255))
          img.save('android_app/assets/splash.png')
          img2 = Image.new('RGBA', (192, 192), (26, 115, 232, 255))
          img2.save('android_app/assets/icon.png')
          "

      # 6. Execute Buildozer
      - name: Build with Buildozer
        working-directory: ./android_app
        env:
          ACCEPT_BUILD_LICENSES: "y"
        run: |
          yes | buildozer -v android debug

      # 7. Upload Compiled APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Nova-Downloader-APK
          path: android_app/bin/*.apk
