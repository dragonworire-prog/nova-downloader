name: Build APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y git python3-pip python3-dev libffi-dev libssl-dev autoconf automake libtool pkg-config ccache wget curl unzip zip openjdk-17-jdk
      - name: Install Buildozer
        run: pip install --upgrade pip setuptools virtualenv Cython buildozer
      - name: Create assets
        working-directory: ./android_app
        run: |
          mkdir -p assets
          pip install Pillow
          python -c "from PIL import Image; Image.new('RGBA',(400,800),(26,115,232,255)).save('assets/splash.png'); Image.new('RGBA',(192,192),(26,115,232,255)).save('assets/icon.png')"
      - name: Build APK
        working-directory: ./android_app
        run: yes | buildozer android debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Nova-Downloader-APK
          path: android_app/bin/*.apk
